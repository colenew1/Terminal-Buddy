name: macOS builds
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:platform && npm run test:settings && npm run test:alerts && npm run test:submit && npm run test:screen
      - run: npm run dist:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:platform-app && npm run test:windows
        env:
          BUDDY_EXE: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Terminal Buddy.app/Contents/MacOS/Terminal Buddy
      - uses: actions/upload-artifact@v4
        with:
          name: Terminal-Buddy-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
